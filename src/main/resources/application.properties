spring.application.name=vehiculos-documentos-api

# Conexion a base de datos XAMPP
spring.datasource.url = jdbc:mysql://localhost:3306/transporte
spring.datasource.username = root
spring.datasource.password=
spring.datasource.driver-class-name = com.mysql.cj.jdbc.NonRegisteringDriver

#JPA / Hibernate
spring.jpa.hibernate.ddl-auto = validate
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MariaDBDialect
