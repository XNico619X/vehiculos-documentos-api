services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-vehiculos
    ports:
      - "5672:5672"     # Puerto estandar AMQP
      - "15672:15672"   # Consola de administracion Web (http://localhost:15672 - usuario: guest / clave: guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped

